spring.application.name=ikernell-backend

# ===============================
# DATABASE CONFIG (Uso de variables de entorno)
# ===============================
# Si la variable no existe, usa el valor después de los dos puntos
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ikernell_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:fabrica2024*}

# Pool de conexiones (Hikari es el estándar por defecto en Spring Boot)
spring.datasource.hikari.maximum-pool-size=10

# ===============================
# JPA / HIBERNATE
# ===============================
# 'update' es útil en desarrollo, pero en producción se usa 'validate' o 'none'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Importante para que Hibernate sepa cómo hablar con Postgres 12+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# SERVER & JSON
# ===============================
server.port=${PORT:8080}
server.error.include-message=always

# Formato de fechas consistente para el Frontend
spring.jackson.serialization.write-dates-as-timestamps=false